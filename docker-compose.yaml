services:
  postgres:
    image: postgres:17
    container_name: cloud_drive_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: cloud_drive_minio
    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.1.1
    container_name: cloud_drive_kafka

    ports:
      - "9094:9094"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test: [ "CMD-SHELL", "timeout 10s bash -c 'echo > /dev/tcp/localhost/9092' || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  redis:
    image: redis:8-alpine
    container_name: cloud_drive_redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

  minio-init:
    build:
      context: .
      args:
        - HTTP_PROXY=http://host.docker.internal:10808
        - HTTPS_PROXY=http://host.docker.internal:10808
        - NO_PROXY=localhost,127.0.0.1,postgres,redis,kafka,minio
    command: python manage.py ensure_minio_bucket
    env_file:
      - .env
    environment:
      MINIO_ENDPOINT: minio:9000
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  nginx:
    image: nginx:alpine

    container_name: drive-nginx
    ports:
      - "8080:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - api
      - minio

    restart: unless-stopped

  migrate:
    build:
      context: .
      args:
        - HTTP_PROXY=http://host.docker.internal:10808
        - HTTPS_PROXY=http://host.docker.internal:10808
        - NO_PROXY=localhost,127.0.0.1,postgres,redis,kafka,minio
    container_name: drive-migrate
    command: python manage.py migrate
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/1
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: localhost:8080
    depends_on:
      - postgres
    restart: "no"

  api:
    build:
      context: .
      args:
        - HTTP_PROXY=http://host.docker.internal:10808
        - HTTPS_PROXY=http://host.docker.internal:10808
        - NO_PROXY=localhost,127.0.0.1,postgres,redis,kafka,minio
    container_name: drive-api

    command: >
      sh -c "gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"

    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/1
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: localhost:8080
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  complete-upload-consumer:
    build:
      context: .
      args:
        - HTTP_PROXY=http://host.docker.internal:10808
        - HTTPS_PROXY=http://host.docker.internal:10808
        - NO_PROXY=localhost,127.0.0.1,postgres,redis,kafka,minio
    container_name: drive-complete-upload-consumer

    command: python manage.py consume_upload_events

    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/1
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: localhost:8080

    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  quota-consumer:
    build:
      context: .
      args:
        - HTTP_PROXY=http://host.docker.internal:10808
        - HTTPS_PROXY=http://host.docker.internal:10808
        - NO_PROXY=localhost,127.0.0.1,postgres,redis,kafka,minio
    container_name: drive-quota-consumer

    command: python manage.py consume_quota_events

    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/1
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: localhost:8080

    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  kafka_data:
  redis_data: